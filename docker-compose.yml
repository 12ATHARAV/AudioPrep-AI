version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: audioprep-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-audioprep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-audioprep_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-audioprep_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audioprep -d audioprep_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE:-audioprep-backend:latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: audioprep-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-audioprep}:${POSTGRES_PASSWORD:-audioprep_secure_pass}@postgres:5432/${POSTGRES_DB:-audioprep_db}
    volumes:
      - temp_data:/app/data
    ports:
      - "8000:8000"

  frontend:
    image: ${FRONTEND_IMAGE:-audioprep-frontend:latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: audioprep-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  temp_data:
