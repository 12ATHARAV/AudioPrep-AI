name: AudioPrep CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase repository name for Docker tags
        id: repo_name
        run: echo "IMAGE_PREFIX=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.repo_name.outputs.IMAGE_PREFIX }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.repo_name.outputs.IMAGE_PREFIX }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Downcase repository name
        id: repo_name
        run: echo "IMAGE_PREFIX=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 30m
          command_timeout: 30m
          script: |
            set -e
            APP_DIR="/home/ubuntu/the-podcaster"
            mkdir -p $APP_DIR
            touch $APP_DIR/backend.env

            # Write production docker-compose.yml on EC2
            cat << 'EOF' > $APP_DIR/docker-compose.yml
            services:
              postgres:
                image: postgres:16-alpine
                container_name: audioprep-postgres
                restart: always
                environment:
                  POSTGRES_USER: ${POSTGRES_USER:-audioprep}
                  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-audioprep_secure_pass}
                  POSTGRES_DB: ${POSTGRES_DB:-audioprep_db}
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                ports:
                  - "5432:5432"
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U audioprep -d audioprep_db"]
                  interval: 10s
                  timeout: 5s
                  retries: 5

              backend:
                image: ghcr.io/${{ steps.repo_name.outputs.IMAGE_PREFIX }}/backend:latest
                container_name: audioprep-backend
                restart: always
                depends_on:
                  postgres:
                    condition: service_healthy
                env_file:
                  - ./backend.env
                volumes:
                  - temp_data:/app/data
                ports:
                  - "8000:8000"

              frontend:
                image: ghcr.io/${{ steps.repo_name.outputs.IMAGE_PREFIX }}/frontend:latest
                container_name: audioprep-frontend
                restart: always
                ports:
                  - "80:80"
                  - "443:443"
                volumes:
                  - /etc/letsencrypt:/etc/letsencrypt:ro
                depends_on:
                  - backend

            volumes:
              postgres_data:
              temp_data:
            EOF

            cd $APP_DIR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker image prune -af || true
            docker compose pull backend frontend
            docker compose up -d --remove-orphans
            docker image prune -af || true
